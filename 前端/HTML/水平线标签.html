<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <p>自古情深留不住</p>
        <hr size="5" width="500" color="#FF0000"> </hr>
        <p>总是套路得人心</p>
        <!--水平分割线，可以在视觉商将文档分割成各种部分，在网页中常常看到
        一些水平线将段落与段落之间隔开，是得文档结构清晰，层次分明。-->
        <!--属性介绍：
        align = "属性值"：对其方式。属性值包括left，center，right。
        size = "2":设定线条粗细。以像素为单位，内定为2。
        width = "500"或width = "70%":设定线条长度。
        color = "........":设置线条颜色。
        noshade：不要阴影，即设定线条为平面显示，若没有这个属性则表示线条具有阴影或立体。-->
    
</body>
</html>
