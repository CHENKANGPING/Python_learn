<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--表格标签
    <table>表示，一个表格<table>是由每航<tr>组成
    每行是由每个单元格<td>组成-->
    
    <table border="1">
            <caption align="center">标题</caption>
            <tr>
                    <td>ckp</td>
                    <td>22</td>
                    <td rowspan="2">男</td>
            </tr>


            <tr>
                    <td>hyf</td>
                    <td>22</td>

                    <td colspan="2">男</td>
            </tr>
            
    </table>

    <!--属性
    border:边框
    style = "border-collapse:collapse;"单元格的线和表格的边框线合并
    width:宽度
    height:高度
    bordercolor:表格的边框颜色
    align:表格的水平对齐方式，可以填left right center 这里不是设置内容的对齐方式
    celladding:单元格内容到边的距离，像素为单位
    cellspacing:单元格和单元格之间的距离（外边距），像素为单位
    bgcolor = "":表格的背景颜色
    background = "路径src/...":背景图片
    bordercolorlight:表格的上、左边框，以及单元格的右、下边框的颜色
    bordercolordark:表格的右、下边框，以及单元格的上、左的边框的颜色 这两个属性的目的是为了设置3D的效果。
    dir:公有属性，单元格内容的排列方式(direction)。 可以 取值：ltr：从左到右（left to right，默认），rtl：从右到左（right to left） 既然说dir是共有属性，如果把这个属性放在任意标签中，那表明这个标签的位置可能会从右开始排列。
    -->

    <!--行 <tr>
    属性：dir：公有属性，设置这一行单元格内容的排列方式，ltr从左到右，rtl从右到左
         bgcolor：设置这一行的单元格的背景色
         height：一行的高度
         align = "center" 一行的内容水平居中显示，left center right
         valign = "center" 一行的内容垂直居中，top middle bottom-->

    <!--单元格 <td>
    属性：align：内容的横向对齐方式。属性值可以填：left right center。
        valign：内容的纵向对齐方式。属性值可以填：top middle bottom
        width：绝对值或者相对值(%)
        height：单元格的高度
        bgcolor：设置这个单元格的背景色。
        background：设置这个单元格的背景图片 -->

    <!--单元格合并
    属性：colspan:横向合并 例如colspan="2"表示当前单元格在水平方向上要占据两个单元格的位置。
    rowspan：纵向合并。例如rowspan="2"表示当前单元格在垂直方向上要占据两个单元格的位置。-->

    <!--<th>:加粗的单元格。相当于<td> + <b>-->

    <!--<caption>: 表格的标题，使用时和tr并列
        属性：align 表示标题相对于表格的位置。属性取值可以是：left、center、right、top、bottom -->



    
    
</body>
</html>
