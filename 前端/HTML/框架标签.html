<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <!--<frameset>:框架的集合
        属性：rows：水平分割，将框架分为上下部分
        绝对值写法：rows = "200,*" 其中*代表剩余的
        相对值写法：rows = "30%,*"其中*代表剩余的。这里其实包含了两个框架：上面的框架占30%，下面的框架占70%。
        
        
        cols:垂直分割，将框分为左右部分
        绝对值写法：cols="200,*" 其中*代表剩余的。这里其实包含了两个框架：左边的框架占200个像素，右边的框架占剩下的部分。
        相对值写法：cols="30%,*" 其中*代表剩余的。这里其实包含了两个框架：左边的框架占30%，右边的框架占70%。
        -->
    <frameset rows="20%,*">
            <frame src="top.html"></frame>
            <frameset cols="40%,*">
                <frame src="left.html"></frame>
                <frame src="right.html"></frame>
            </frameset>
    </frameset>

        
    

</html>
