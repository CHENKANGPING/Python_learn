<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--超链接的属性
        href：目标url
        title：悬停文本
        name：主要用于设置一个锚点的名称
        target：告诉浏览器用什么方式来打开目标页面
                target属性：
                        _self:在同一网页网页中显示
                        _blank:在新网页中打开
                        _parent：在父窗口中显示
                        _top：在顶级窗口中显示-->
    <!--title举例-->
    <a href="09_img.html" title="很好看哦">结婚照</a>
    
</body>
</html>
