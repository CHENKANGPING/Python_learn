<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<input type="text" value="" id="i1"> <button onclick="start()">开始</button> <button onclick="end()">结束</button>

</body>
<script>

  function showtime() {
        var now = new Date();
        var now_str = now.toLocaleString();
        console.log(now_str);

        // 将时间字符串赋值给input标签的value属性；
        var ele = document.getElementById("i1")
        console.log(ele);
        ele.value = now_str;

  }
  var id;
  // 获取当前时间的字符串
  function start() {
      if (id === undefined){
          showtime();
          id = setInterval(showtime,1000);
      }

  }
  function end(){
      clearInterval(id)
      id = undefined;
  }

</script>
</html>
