<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<!--标题标签-->
<h1>hello world</h1>
<h2>hello world</h2>
<h3>hello world</h3>
<h4>hello world</h4>
<h5>hello world</h5>
<h6>hello world</h6>

<!--段落标签-->

自嘲<br>
本是后山人<br>
偶做前堂客<br>
醉舞经阁半卷书<br>
坐井说天阔<br>

<p>自嘲</p>
<p>本是后山人</p>
<p>偶做前堂客</p>
<p>醉舞经阁半卷书</p>
<p>坐井说天阔</p>

<!--功能分类-->
<!--    块级标签(block):
            独占一行
            p, h1-h6
         内联标签(inline):
             按内容占
             b,strong,i,em-->


<!--文本格式标签-->
ckp
<b>ckp</b>
<strong>ckp</strong>

<i>ckp</i>
<em>ckp</em>

<!--基本嵌套原则
        块级可以嵌套块级和内联
        内联只可以嵌套内联-->

<strong><i>ckp</i></strong>

<del>ckp</del>

<!--特殊符号-->
<!--&nbsp空格-->
ckp&nbsp;&nbsp;&nbsp;zj


</body>
</html>
