<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>

<h3>注册用户</h3>

<form action="http://127.0.0.1:8888" method="post" enctype="application/x-www-form-urlencoded">
    <p>姓名：<input type="text" name="user"></p>
    <p>密码：<input type="password" name="pwd"></p>
    <p>爱好:
        篮球<input type="checkbox" name="hobby" value="basketball">
        篮球<input type="checkbox" name="hobby" value="football">

    </p>

    <p>
        性别：
        男<input type="radio" name="gender" value="1">
        女<input type="radio" name="gender" value="2">
        其他<input type="radio" name="gender" value="3">
    </p>

    <p>
        生日：<input type="date" name="birth">
    </p>

    <p>
        籍贯：
        <select name="province" id="" multiple = "multiple" size="2">
            <option value="gansu">甘肃省</option>
            <option value="hebei">河北省</option>
            <option value="dongbei" selected = "selected">东北省</option>
        </select>
    </p>

    <p>
        个人简介:
        <textarea name="info" cols="20" rows="10" placeholder="个人简介"></textarea>
    </p>

    <p>
        <input type="submit">
        <input type="button" value="按钮">
        <input type="reset" value="重置">
        <button>提交数据</button>
    </p>

</form>

</body>
</html>
