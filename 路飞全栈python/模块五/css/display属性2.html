<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    .c1,.c2,.c3{
      width: 200px;
      height: 200px;
    }
    .c1{
      background-color: #336699;
        display: inline-block;
    }
    .c2{
      background-color: blue;
        /*设置inline-block的元素兼具inline的不占整行以及*/
        /*block的可以设置长宽的特性*/
        display: inline-block;


    }
    .c3{
      background-color: red;
        display: inline-block;

    }
  </style>
</head>
<body>

<div class="c1">c1</div>
<div class="c2">c2</div>
<div class="c3">c3</div>

</body>
</html>
