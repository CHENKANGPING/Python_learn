<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    .lunbotu{
      width: 1200px;
      height: 1200px;
      border: 1px solid rebeccapurple;
      margin: 100px auto;
      position: relative;
    }
    .lunbotu ul{
      list-style: none;
    }
    .lunbotu .imgs li{
      position: absolute;
      top: 0;
      left: 0;

    }
    .lunbotu .btn li{
      position: absolute;
    }
    .lunbotu .btn .left_btn{
      left: 0;
      top: 50%;
    }
    .lunbotu .btn .right_btn{
      right: 0;
      top: 50%;
    }
    .lunbotu .btn div{
      width: 30px;
      height: 60px;
      background-color: gray;
      color: white;
      text-align: center;
      line-height:60px;
      border-radius: 15%;
      font-size: 20px;
      margin-top: 30px;

    }

  </style>
</head>
<body>

<div class="lunbotu">
  <ul class="imgs">
    <li><a href=""><img src="imgs/01.png" alt=""></a> </li>
    <li><a href=""><img src="imgs/02.png" alt=""></a> </li>
    <li><a href=""><img src="imgs/03.png" alt=""></a> </li>
  </ul>

  <ul class="btn">
    <li class="left_btn"><div><</div></li>
    <li class="right_btn"><div>></div></li>
  </ul>
</div>

</body>
</html>
