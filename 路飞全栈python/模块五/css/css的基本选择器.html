<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        /*标签选择器*/
        div{
            color: brown;
        }
        li{
            color: darkcyan;
        }


        /*id选择器*/
        #i1{
            color: aqua;
        }


        /*class选择器*/
        .c1{
            color: blue;
        }



        /*通配选择器*/
        *{
            color: blueviolet;
        }



    </style>
</head>
<body>

<div>ckp</div>

<ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
</ul>

<p id="i1">p标签</p>
<p id="i2">p标签</p>
<p class="c1">p标签</p>
<p class="c1">p标签</p>
<p class="c1">p标签</p>

</body>
</html>
