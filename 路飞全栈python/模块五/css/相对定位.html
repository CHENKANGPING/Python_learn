<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    .c1{
      width: 200px;
      height: 200px;
      background-color: indianred;
    }
    .c2{
      width: 200px;
      height: 200px;
      background-color: orange;
      /*相对定位：参照物：元素本身位置 脱离文档流*/
      /*position: relative;*/
      /*绝对定位 参照物：已经定位的最近父级元素作为参照直至body标签 完全脱离文档流*/
      position: absolute;
      left: 200px;
      top: 200px;
    }
    .c3{
      width: 200px;
      height: 200px;
      background-color: lightblue;
    }
  </style>
</head>
<body>

<div class="c1"></div>
<div class="c2"></div>
<div class="c3"></div>

</body>
</html>
