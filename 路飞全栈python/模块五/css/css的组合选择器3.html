<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        /*毗邻标签*/
        .c2 + div{
            color: red;
        }

        /*兄弟选择器*/
        .c2 ~ div{
            color: #336699;
        }
    </style>
</head>
<body>

<div class="c1">item1</div>
<div class="c2">item2</div>
<div class="c3">item3</div>
<div class="c4">item4</div>
<div class="c5">item5</div>
<p>itme6</p>


</body>
</html>
